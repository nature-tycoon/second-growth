<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Second Growth — animal size review</title>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
<style>
body{margin:0;padding:24px;background:#edf0e8;color:#26392e;font:15px system-ui}h1{font-size:24px;margin:0 0 8px}p{margin:8px 0 16px}label{margin-right:16px}select{font:inherit;padding:6px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}article{background:#fafbf7;border:1px solid #d1d9cd;border-radius:10px;padding:12px}article[hidden]{display:none}h2{font-size:15px;margin:0}canvas{display:block;width:100%;aspect-ratio:4/3}small{display:block;color:#536553;font-variant-numeric:tabular-nums}#status{font-size:13px}@media(max-width:850px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){main{grid-template-columns:1fr}}
</style>
<h1>Animal sizes at the game's scale</h1>
<p>Every card uses the same camera and scale. The grey visitor is a size reference. Tiny animals keep their visibility boosts.</p>
<label>Map <select id="map"></select></label>
<label>Models <select id="version"><option value="current">Current</option><option value="before">Before size audit</option></select></label>
<label>View <select id="view"><option value="side">Side</option><option value="quarter">Three-quarter</option><option value="above">Above</option></select></label>
<label>Zoom <select id="zoom"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
<label><input id="boost" type="checkbox" checked> Visibility boosts</label>
<label><input id="fly" type="checkbox"> Spread wings</label>
<p id="status">Loading models…</p><main></main>
<script type="module">
import * as THREE from 'three';
import {adultAnimalScale} from '../js/render3d/animal-scale.js';
import {loadAnimals,ANIMALS} from '../js/data/animals.js';
const revision=Date.now(),{buildSpecies,faunaMaterial,PERSON_LOOKS}=await import('../js/render3d/fauna.js?sizeReview='+revision);
const maps=['pnw','atlanta','amazon','reef','sumatra','chinandega','serengeti'];
const controls=Object.fromEntries(['map','version','view','zoom','boost','fly'].map(id=>[id,document.getElementById(id)]));
for(const map of maps)controls.map.add(new Option(map,map));
controls.map.value=new URLSearchParams(location.search).get('map')||'serengeti';
const response=await fetch('./map-audit-output/animal-size-audit-before.json');
const before=response.ok?await response.json():[];
controls.version.querySelector('[value="before"]').disabled=before.length===0;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(360,270);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NeutralToneMapping;
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1.35,1.35,1.0125,-1.0125,.01,100);
scene.add(new THREE.HemisphereLight(0xe4eeff,0x6f7a4c,1.35));const sun=new THREE.DirectionalLight(0xfff3dc,2.3);sun.position.set(2,4,3);scene.add(sun);
const grid=new THREE.GridHelper(3,12,0x81947b,0xd7dfd1);scene.add(grid);
const person=buildSpecies(PERSON_LOOKS[0]);person.geo.setAttribute('aAnim',new THREE.InstancedBufferAttribute(new Float32Array(4),4));
const reference=new THREE.InstancedMesh(person.geo,new THREE.MeshLambertMaterial({color:0x9ca59a,transparent:true,opacity:.48}),1);reference.setMatrixAt(0,new THREE.Matrix4().makeScale(.012,.012,.012).setPosition(-.98,0,0));scene.add(reference);
const entries=[];
for(const map of maps){
 loadAnimals((await import(`../js/data/animals-${map}.js?sizeReview=${revision}`)).default);
 for(const def of ANIMALS){
  for(const male of [false,...(def.sprite.male?[true]:[])]){
   const old=before.find(d=>d.map===map&&d.key===def.key)?.sprite||def.sprite;
   const variants={current:male?{...def.sprite,...def.sprite.male}:def.sprite,before:male?{...old,...old.male}:old};
   const models={};
   for(const [version,sprite]of Object.entries(variants)){
    const built=buildSpecies({...def,sprite});const anim=new THREE.InstancedBufferAttribute(new Float32Array(4),4);built.geo.setAttribute('aAnim',anim);
    const mesh=new THREE.InstancedMesh(built.geo,faunaMaterial(built.motion),1);built.geo.computeBoundingBox();
    models[version]={...built,mesh,anim,sprite};
   }
   const article=document.createElement('article'),h=document.createElement('h2'),canvas=document.createElement('canvas'),details=document.createElement('small');canvas.width=360;canvas.height=270;
   h.textContent=def.name+(male?' · '+(def.sprite.maleName||'male'):'');article.append(h,canvas,details);
   const e={map,name:def.name,models,article,canvas,details};entries.push(e);
  }
 }
}
entries.sort((a,b)=>{
 const max=e=>{const b=e.models.current.geo.boundingBox,s=adultAnimalScale(e.models.current.sprite);return Math.max(b.max.x-b.min.x,b.max.y-b.min.y,b.max.z-b.min.z)*s;};return max(b)-max(a);
});
for(const e of entries)document.querySelector('main').append(e.article);
function draw(){
 const zoom=Number(controls.zoom.value),dir=new THREE.Vector3(...({side:[0,0,1],quarter:[.4,.25,1],above:[.05,1,.12]}[controls.view.value])).normalize();
 camera.left=-1.35/zoom;camera.right=1.35/zoom;camera.top=1.0125/zoom;camera.bottom=-1.0125/zoom;camera.position.copy(new THREE.Vector3(0,.68/zoom,0)).addScaledVector(dir,5);camera.lookAt(0,.68/zoom,0);camera.updateProjectionMatrix();
 let count=0;
 for(const e of entries){
  e.article.hidden=e.map!==controls.map.value;if(e.article.hidden)continue;count++;
  const b=e.models[controls.version.value],show=controls.boost.checked?(b.sprite.show||1):1,sc=adultAnimalScale(b.sprite,controls.boost.checked),box=b.geo.boundingBox;
  const fly=controls.fly.checked?1:0;b.anim.setXYZW(0,0,0,fly,0);b.anim.needsUpdate=true;
  b.mesh.setMatrixAt(0,new THREE.Matrix4().makeScale(sc,sc,sc));b.mesh.instanceMatrix.needsUpdate=true;
  scene.add(b.mesh);renderer.render(scene,camera);scene.remove(b.mesh);
  const ctx=e.canvas.getContext('2d');ctx.clearRect(0,0,360,270);ctx.drawImage(renderer.domElement,0,0);
  const d=box.getSize(new THREE.Vector3()).multiplyScalar(sc);e.details.textContent=`Length ${d.x.toFixed(2)} · height ${d.y.toFixed(2)} · width ${d.z.toFixed(2)} tiles · size ×${b.sprite.scale??1} · display ×${show}`;
 }
 document.getElementById('status').textContent=`${count} models on this map · ${entries.length} models and adult variants audited · adult scale, no juvenile/age reduction · grid spacing ¼ tile`;
}
for(const control of Object.values(controls))control.addEventListener('change',draw);draw();
</script>
</html>
