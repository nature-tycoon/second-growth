<!doctype html><html lang="en"><meta charset="utf-8"><title>Second Growth — vegetation review</title>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
<style>
body{margin:24px;background:#eef0e8;color:#27392d;font:15px system-ui}h1{font-size:24px;margin:0 0 8px}p{line-height:1.5;max-width:1080px}label{display:inline-block;margin:0 14px 12px 0}select,button{font:inherit;padding:6px}main{display:grid;grid-template-columns:1fr 1fr;gap:14px}article{background:#fafbf5;border:1px solid #d3dccd;border-radius:12px;padding:12px}h2{font-size:17px;margin:0 0 10px}canvas{width:100%;display:block;aspect-ratio:8/5}small{display:block;margin-top:8px;font-size:12px;color:#5b6857}#status{font-size:13px}pre{white-space:pre-wrap;font-size:12px}@media(max-width:900px){main{grid-template-columns:1fr}}
</style>
<h1>Vegetation review</h1><p id="description">Real plant models in small landscape compositions. This review uses independent fixtures and leaves saved games untouched.</p>
<label>Landscape <select id="landscape"></select></label>
<label>Season <select id="month"><option value="0">March</option><option value="1">April</option><option value="2" selected>May</option><option value="3">June</option><option value="5">August</option><option value="7">October</option><option value="10">January</option></select></label>
<label>View <select id="view"><option value="quarter">Three-quarter</option><option value="low">Low view</option><option value="above">Above</option></select></label>
<label>Framing <select id="zoom"><option value="1">Landscape</option><option value="1.7">Close detail</option><option value=".55">Wide view</option><option value=".25">Distant view</option></select></label>
<label>Graphics <select id="detail"><option value="full">Full</option><option value="fast">Fast</option></select></label>
<label>Snow <select id="snow"><option value="0">None</option><option value=".22">Light</option><option value=".5">Moderate</option><option value="1">Deep</option></select></label>
<label><input id="snowCompare" type="checkbox"> Compare light / deep snow</label>
<label><input id="patterns" type="checkbox" checked> Compare planted drifts</label>
<label><input id="palettes" type="checkbox"> Compare palettes</label>
<button id="bench">Measure drawing</button><p id="status">Preparing vegetation…</p>
<p id="paletteInfo"></p>
<main><article><h2>Before</h2><canvas id="before" width="800" height="500"></canvas><small id="beforeInfo"></small></article><article><h2>Current</h2><canvas id="after" width="800" height="500"></canvas><small id="afterInfo"></small></article></main><pre id="results"></pre>
<script type="module">
import * as THREE from 'three';
import { Flora } from '../js/render3d/flora.js';
import { vegetationFixture, VEGETATION_SCENES } from './vegetation-review-fixtures.mjs?palettes=1';
import { meadowPatch, patchColor } from '../js/render3d/patches.js';
import { snow } from '../js/render3d/snow.js';
import { PALETTES, colorRgb } from '../js/render3d/palettes.js';
let BeforeFlora; try { ({ Flora: BeforeFlora } = await import('./map-audit-output/vegetation-before/flora.js')); } catch { BeforeFlora = null; }
let SpecialistBefore; try { ({ Flora: SpecialistBefore } = await import('./map-audit-output/specialist-trees-before/flora.js')); } catch { SpecialistBefore = null; }
let EvergreenBefore; try { ({ Flora: EvergreenBefore } = await import('./map-audit-output/conifer-shrubs-before/flora.js')); } catch { EvergreenBefore = null; }
let GrovesBefore; try { ({ Flora: GrovesBefore } = await import('./map-audit-output/groves-before/flora.js')); } catch { GrovesBefore = null; }
let PalettesBefore; try { ({ Flora: PalettesBefore } = await import('./map-audit-output/palettes-before/flora.js')); } catch { PalettesBefore = null; }
const baselineFor = def => controls.snowCompare.checked ? null : controls.palettes.checked ? PalettesBefore : def.pass === 'groves' ? GrovesBefore : def.pass === 'evergreen' ? EvergreenBefore : def.tree ? SpecialistBefore : BeforeFlora;
const W = 800, H = 500, gl = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
gl.setSize(W, H); gl.outputColorSpace = THREE.SRGBColorSpace; gl.toneMapping = THREE.NeutralToneMapping;
gl.shadowMap.enabled = true; gl.shadowMap.type = THREE.PCFShadowMap;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200), controls = Object.fromEntries(['landscape','month','view','zoom','detail','patterns','palettes','snow','snowCompare','status','results','bench'].map(id => [id, document.getElementById(id)]));
for (const [key, def] of Object.entries(VEGETATION_SCENES)) controls.landscape.add(new Option(def.name, key));
const params = new URLSearchParams(location.search);
controls.palettes.checked = params.has('palette');
controls.snowCompare.checked = params.has('snow');
if (controls.snowCompare.checked) controls.month.value = '10';
controls.landscape.value = params.get('scene') in VEGETATION_SCENES ? params.get('scene') : 'garden';
if (VEGETATION_SCENES[controls.landscape.value].month != null) controls.month.value = VEGETATION_SCENES[controls.landscape.value].month;
let views = [], busy = false;
function dispose() {
  for (const v of views) {
    for (const p of v.flora.pools.values()) for (const s of p.subs.values()) s.dispose();
    v.scene.traverse(o => { if (!o.isInstancedMesh) o.geometry?.dispose(); });
    v.ground.material.dispose(); v.sun.shadow.dispose();
    const geos = new Set();
    for (const value of v.flora.geos.values()) for (const part of [value, ...Object.values(value), ...Object.values(value.lo || {})]) if (part?.isBufferGeometry) geos.add(part);
    for (const geo of geos) geo.dispose();
    for (const mat of [v.flora.foliage,v.flora.shrubs,v.flora.grass,v.flora.tallGrass,v.flora.bark,v.flora.small]) mat?.dispose();
  }
  views = [];
}
function setup() {
  dispose(); const name = controls.landscape.value, def = VEGETATION_SCENES[name];
  const comparingSnow = controls.snowCompare.checked;
  controls.snow.disabled = comparingSnow;
  document.querySelector('#before').previousElementSibling.textContent = comparingSnow ? 'Light snow' : 'Before';
  document.querySelector('#after').previousElementSibling.textContent = comparingSnow ? 'Deep snow' : 'Current';
  const palette = PALETTES[def.map];
  const paletteInfo = document.getElementById('paletteInfo');
  paletteInfo.replaceChildren();
  if (palette) {
    paletteInfo.append(palette.name + ' · ');
    for (const hex of [palette.needle[0], palette.canopy[1], palette.shrub[0], palette.ground[1], palette.dry, ...palette.autumn]) {
      const swatch = document.createElement('span'); swatch.title = hex;
      swatch.style.cssText = `display:inline-block;width:24px;height:16px;vertical-align:middle;margin-right:5px;border-radius:3px;background:${hex}`;
      paletteInfo.append(swatch);
    }
  }
  document.getElementById('description').textContent = def.note + ' Independent planted fixtures; saved games are untouched.';
  for (const version of ['before','after']) {
    const game = vegetationFixture(name, Number(controls.month.value), comparingSnow || controls.palettes.checked || version === 'after' || !controls.patterns.checked);
    const scene = new THREE.Scene(); scene.background = new THREE.Color('#e5e7d6');
    scene.add(new THREE.HemisphereLight(0xe9f2ff, 0x697149, 1.45));
    const sun = new THREE.DirectionalLight(0xffedcf, 2.3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0006; sun.shadow.normalBias = .012; scene.add(sun, sun.target);
    const geo = new THREE.PlaneGeometry(24, 22, 48, 44).rotateX(-Math.PI / 2).translate(40, -.015, 32);
    const pos = geo.attributes.position, colors = [];
    let base = name === 'savannah' && Number(controls.month.value) >= 3 && Number(controls.month.value) <= 7 ? [.57,.49,.31] : name === 'woodland' || name === 'groves' ? [.36,.40,.25] : [.45,.51,.30];
    if (controls.palettes.checked && palette && version === 'after') base = colorRgb(palette.pasture[game.season]).map(c => c * .65);
    for (let k = 0; k < pos.count; k++) { const c = patchColor(base, meadowPatch(pos.getX(k), pos.getZ(k))); const tint = new THREE.Color().setRGB(...c, THREE.SRGBColorSpace); colors.push(tint.r,tint.g,tint.b); }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    const ground = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true })); ground.receiveShadow = true; scene.add(ground);
    const baseline = baselineFor(def);
    const Builder = version === 'before' && baseline ? baseline : Flora;
    const flora = new Builder(scene); flora.wind.value = 10; flora.setLight(controls.detail.value === 'fast'); flora.setZoom(2); flora.rebuild(game);
    views.push({ version, scene, sun, flora, game, ground });
  }
  refresh();
}
function refresh() {
  const def = VEGETATION_SCENES[controls.landscape.value], zoom = def.zoom * Number(controls.zoom.value), ppu = 46 * zoom;
  camera.left = -W / 2 / ppu; camera.right = W / 2 / ppu; camera.top = H / 2 / ppu; camera.bottom = -H / 2 / ppu;
  const target = new THREE.Vector3(...def.target), el = (controls.view.value === 'above' ? 72 : controls.view.value === 'low' ? 20 : 35) * Math.PI / 180;
  const dir = new THREE.Vector3(Math.sin(Math.PI/4)*Math.cos(el), Math.sin(el), Math.cos(Math.PI/4)*Math.cos(el));
  camera.position.copy(target).addScaledVector(dir, 80); camera.lookAt(target); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  for (const v of views) {
    v.flora.setZoom(zoom); v.sun.position.copy(target).add(new THREE.Vector3(-20,35,12)); v.sun.target.position.copy(target); v.sun.target.updateMatrixWorld();
    const sc = v.sun.shadow.camera, extent = 12; sc.left = sc.bottom = -extent; sc.right = sc.top = extent; sc.near = 1; sc.far = 90; sc.updateProjectionMatrix();
    snow.uSnow.value = controls.snowCompare.checked ? (v.version === 'before' ? .22 : 1) : Number(controls.snow.value);
    gl.render(v.scene,camera); document.getElementById(v.version).getContext('2d').drawImage(gl.domElement,0,0);
    document.getElementById(v.version+'Info').textContent = `${gl.info.render.triangles.toLocaleString()} submitted triangles · ${gl.info.render.calls} draw calls, including shadows`;
  }
  const baseline = baselineFor(def);
  controls.status.textContent = `Ready · ${def.name} · ${controls.month.selectedOptions[0].text} · ${controls.detail.value === 'fast' ? 'Fast' : 'Full'} detail${controls.snowCompare.checked ? ' · light/deep snow on identical trees' : baseline ? ' · before/after comparison' : ' · local baseline unavailable; both panes show current models'}`;
}
controls.landscape.onchange = () => {
  const def = VEGETATION_SCENES[controls.landscape.value];
  if (def.month != null) controls.month.value = def.month;
  setup();
};
for (const id of ['month','detail','patterns','palettes','snowCompare']) controls[id].onchange = setup;
for (const id of ['view','zoom','snow']) controls[id].onchange = refresh;
controls.bench.onclick = async () => {
  if (busy) return; busy = true; controls.bench.disabled = true;
  try {
    const ctx = gl.getContext(), pixel = new Uint8Array(4), rows = ['Plant scene only; median drawing + synchronous readback after warm-up. Not total game FPS.'];
    for (const name of ['garden','savannah','woodland']) {
      controls.landscape.value = name; setup(); await new Promise(requestAnimationFrame);
      const samples = views.map(() => []);
      for (let k = 0; k < 12; k++) for (const j of k % 2 ? [0,1] : [1,0]) {
        const t = performance.now(); gl.render(views[j].scene,camera); ctx.readPixels(0,0,1,1,ctx.RGBA,ctx.UNSIGNED_BYTE,pixel);
        if (k >= 3) samples[j].push(performance.now()-t);
      }
      rows.push(name+': '+samples.map((s,j) => `${views[j].version} ${s.sort((a,b)=>a-b)[4].toFixed(2)} ms`).join(' · '));
    }
    controls.results.textContent = rows.join('\n');
  } finally { busy = false; controls.bench.disabled = false; }
};
setup();
</script></html>
