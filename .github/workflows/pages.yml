name: Publish secondgrowth.earth

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - run: node tools/website-security-check.mjs
      - run: node tools/website-check.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/website
      - name: Publish website and game
        id: deployment
        uses: actions/deploy-pages@v4
