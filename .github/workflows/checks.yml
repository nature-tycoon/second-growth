# Pull requests get the fast headless suite. The slower browser suite runs before the
# itch.io upload on main (itch.yml calls this workflow) and whenever it's started by hand.
name: Release checks

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    # (about 10 minutes on a fast runner; a slow one runs every check ~1.8x slower and passed 15
    # minutes, cancelled mid-suite on PRs 95 and 96 with nothing failing)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node tools/check-release.mjs --headless
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: headless-checks
          path: tools/release-output/
          retention-days: 14
  browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # (the suite takes 33 to over 60 minutes on CI's software graphics, depending on the runner: at 60,
    # a slow runner cut it off in the last check with everything passing)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check Chromium availability
        run: google-chrome --version
      - run: node tools/check-release.mjs --browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-checks
          path: tools/release-output/
          retention-days: 14
