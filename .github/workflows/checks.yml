# Pull requests get the fast headless suite. The slower browser suite runs before the
# itch.io upload on main (itch.yml calls this workflow) and whenever it's started by hand.
name: Release checks

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node tools/check-release.mjs --headless
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: headless-checks
          path: tools/release-output/
          retention-days: 14
  browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check Chromium availability
        run: google-chrome --version
      - run: node tools/check-release.mjs --browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-checks
          path: tools/release-output/
          retention-days: 14
