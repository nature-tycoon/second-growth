# Pull requests get the fast headless suite, and main is protected so a PR merges only once its
# `headless` job passes (`gh pr merge N --merge --auto`). The slower browser suite runs before the
# itch.io upload on main (itch.yml calls this workflow) and whenever it's started by hand.
name: Release checks

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# (a new push to a PR cancels that PR's older run; elsewhere each run has a group of its own)
concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: ubuntu-latest
    # (about 10 minutes on a fast runner; a slow one runs every check ~1.8x slower and passed 15
    # minutes, cancelled mid-suite on PRs 95 and 96 with nothing failing)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node tools/check-release.mjs --headless
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: headless-checks
          path: tools/release-output/
          retention-days: 14
  browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # (the suite took 33 to over 60 minutes in one job on CI's software graphics, so it runs as four
    # parts at once, split by each check's CI time in check-release.mjs: about 15 minutes each)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: browser (${{ matrix.shard }}/4)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check Chromium availability
        run: google-chrome --version
      - run: node tools/check-release.mjs --browser --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-checks-${{ matrix.shard }}
          path: tools/release-output/
          retention-days: 14
