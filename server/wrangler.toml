# Second Growth's backend (feedback email, newsletter signup, ratings). Setup: docs/backend-setup.md
name = "second-growth-api"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Uncomment once secondgrowth.earth is on Cloudflare (step 7 of the setup doc):
# routes = [{ pattern = "api.secondgrowth.earth", custom_domain = true }]

[vars]
FEEDBACK_TO = "info@secondgrowth.earth"
FEEDBACK_FROM = "Second Growth feedback <feedback@secondgrowth.earth>"
# Where share links point (decision 0047); the game reads ?farm= there
SHARE_BASE = "https://secondgrowth.earth/play/"
# Kit tag ids (numbers from the tag's page URL in Kit); leave empty to skip tagging
KIT_TAG_WEBSITE = ""
KIT_TAG_GAME = ""
# Secrets, set with `npx wrangler@4 secret put NAME`, never written here:
#   RESEND_API_KEY, KIT_API_KEY

[[d1_databases]]
binding = "DB"
database_name = "second-growth"
database_id = "PASTE-THE-ID-FROM-wrangler-d1-create"

# Shared farms (decision 0047): kept a year each
[[kv_namespaces]]
binding = "FARMS"
id = "PASTE-THE-ID-FROM-wrangler-kv-namespace-create"

# 5 requests a minute per visitor to /feedback, /subscribe, /farms and /farms/<id>/report (period must be 10 or 60)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
