      <h1 class="ls-title">Second Growth</h1>

  <script>
    // A field note to read while the game loads, from any of the three places.
    (function () {
      var tips = [
        'Beavers are ecosystem engineers: one dam can turn a ditch into a wetland full of frogs and ducks.',
        'Coho salmon need shaded, cool creeks. Plant alders and willows along the banks.',
        'Snags (standing dead trees) are homes for woodpeckers, owls and bats.',
        'Pulling fences lets deer and elk wander in from the surrounding forest.',
        'Native meadows of camas and lupine feed the pollinators that feed everything else.',
        'Fire renews meadows. A rare crown fire can turn old forest back into open ground.',
        'You never buy animals here. Build the habitat and they find their own way in.',
        'In the Amazon, muvuca is a sack of dozens of native seeds sown together: fast pioneers and future giants at once.',
        'Agoutis are the only animals that bury Brazil nuts. No agoutis, no new Brazil nut trees.',
        'Howler monkeys never come down to the ground. They can only reach new forest through an unbroken canopy.',
        'On the Serengeti, half-moon pits catch the rain and blown seed, so grass can take hold on bare, crusted ground.',
        'Grass fires keep the savanna open: they kill tree seedlings but not the grown, thick-barked acacias.',
        'Dung beetles and vultures only live where there are herds to follow.'
      ];
      var el = document.getElementById('loading-tip');
      if (el) el.textContent = tips[Math.floor(Math.random() * tips.length)];
    })();
  </script>
