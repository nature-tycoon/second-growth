<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Second Growth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head>
<body>
  <canvas id="view"></canvas>

  <header id="topbar" class="panel">
    <div class="brand">
      <svg viewBox="0 0 32 32" class="logo" aria-hidden="true">
        <path d="M16 3 L25 17 H20 L27 26 H5 L12 17 H7 Z" fill="#3f6b3a"/>
        <path d="M16 3 L25 17 H20 L27 26 H16 Z" fill="#2f5530"/>
        <rect x="14.5" y="26" width="3" height="4" fill="#6b4a34"/>
      </svg>
      <div>
        <div class="title">Second Growth</div>
        <div class="subtitle">Hollis Farm restoration</div>
      </div>
    </div>
    <div class="stat money" id="stat-money" title="Conservation budget">$0</div>
    <div class="stat date"><span id="stat-weather" class="weather"></span><div><div id="stat-season" class="season"></div><div id="stat-date" class="small"></div></div></div>
    <div class="speed" id="speed">
      <button data-speed="0" title="Pause (Space)"><svg viewBox="0 0 16 16"><rect x="4" y="3" width="3" height="10"/><rect x="9" y="3" width="3" height="10"/></svg></button>
      <button data-speed="1" title="Normal"><svg viewBox="0 0 16 16"><path d="M5 3 L12 8 L5 13Z"/></svg></button>
      <button data-speed="2" title="Fast"><svg viewBox="0 0 16 16"><path d="M2 3 L8 8 L2 13Z M8 3 L14 8 L8 13Z"/></svg></button>
      <button data-speed="3" title="Fastest"><svg viewBox="0 0 16 16"><path d="M1 3 L5.5 8 L1 13Z M5.5 3 L10 8 L5.5 13Z M10 3 L14.5 8 L10 13Z"/></svg></button>
    </div>
    <button class="stat score" id="stat-score" title="Ecosystem health (open report)">
      <div class="ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" class="track"/><circle cx="18" cy="18" r="15" class="fill" id="score-ring"/></svg><span id="score-num">0</span></div>
      <div><div class="small">Ecosystem</div><div class="label">Health</div></div>
    </button>
    <button class="stat species" id="stat-species" title="Open the field guide">
      <svg viewBox="0 0 24 24" class="ico"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 17h11" stroke="currentColor" stroke-width="1.8"/></svg>
      <div><div class="label" id="species-num">0</div><div class="small">species</div></div>
    </button>
    <button class="stat visitors" id="stat-visitors" title="Visitors (open details)">
      <svg viewBox="0 0 32 32" class="ico"><circle cx="17" cy="5.5" r="3.2" fill="currentColor"/><path d="M15 10 L12 19 L8 28 M15 10 L18 18 L22 28 M15 12 L20 16 M13 12 L9 17" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>
      <div><div class="label" id="visitor-num">0</div><div class="small" id="visitor-stars">no trailhead</div></div>
    </button>
    <div class="spacer"></div>
    <div class="top-actions">
      <select id="overlay" title="Map overlay">
        <option value="none">Overlay: none</option>
        <option value="habitat">Habitat types</option>
        <option value="moisture">Moisture</option>
        <option value="soil">Soil health</option>
        <option value="light">Sunlight</option>
        <option value="elevation">Elevation</option>
        <option value="disturb">Visitor disturbance</option>
        <option value="fish">Fish passage</option>
        <option value="species">Species habitat</option>
      </select>
      <button id="btn-trees" class="ghost" title="See through trees (T)">Trees</button>
      <button id="btn-goals" class="ghost">Goals</button>
      <button id="btn-journal" class="ghost">Journal</button>
      <button id="btn-menu" class="ghost" title="Menu">☰</button>
    </div>
  </header>

  <nav id="toolbar" class="panel"></nav>
  <aside id="toolpanel" class="panel hidden"></aside>
  <aside id="infopanel" class="panel hidden"></aside>
  <div id="legend" class="panel hidden"></div>
  <div id="toasts"></div>
  <div id="minimap-wrap" class="panel"><button id="mini-toggle" title="Show or hide the map">Map</button><canvas id="minimap"></canvas></div>
  <div id="banner" class="panel hidden"></div>
  <div id="cursor-tip" class="hidden"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
